; Прошивка контроллера капельного полива (ESP32 DevKitC 38 pin, C++ / Arduino).
; Сборка:   python -m platformio run            (из firmware/esp32, python из .venv)
; Прошивка: python -m platformio run -t upload --upload-port COM8
; Консоль:  python -m platformio device monitor -p COM8
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LEVEL=4
    -DFW_VERSION=\"1.1.3\"
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    ricmoo/QRCode@^0.0.1
