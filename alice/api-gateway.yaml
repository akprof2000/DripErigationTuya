openapi: 3.0.0
info:
  title: drip-alice
  version: 1.0.0
# Все пути — в одну функцию; FUNCTION_ID и SERVICE_ACCOUNT_ID подставить при создании шлюза.
paths:
  /{path+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: FUNCTION_ID
        service_account_id: SERVICE_ACCOUNT_ID
        payload_format_version: "1.0"
